<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Package | X-Cargo Express</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>X-Cargo Express</h1>
  <p>Fast, Secure & Reliable Package Delivery Worldwide</p>
</header>

<main>

  <section class="intro">
    <h2>Track Your Shipment</h2>
    <p>
      Enter your tracking number below to view the live status of your shipment.
    </p>
  </section>

  <section class="tracking-section">
    <input
      type="text"
      id="trackingId"
      placeholder="Enter your tracking number"
    >

    <button onclick="trackPackage()">
      Track Package
    </button>

    <div id="trackingInfo"></div>
  </section>

</main>

<footer>
  <p>&copy; 2025 X-Cargo Express. All Rights Reserved.</p>
</footer>

<script type="module" src="tracker.js"></script>

</body>
</html>
